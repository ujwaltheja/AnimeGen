# Open-weight image-to-video profiles (Hugging Face Diffusers)
#
# ti2v_5b  — Wan 2.2 TI2V-5B: Apache 2.0, 720p, ~24GB VRAM (RTX 4090 / A5000)
# i2v_a14b — Wan 2.2 I2V-A14B MoE: Apache 2.0, 720p, ~48GB+ VRAM (A6000 / A100 40GB)

profiles:
  ti2v_5b:
    model_id: Wan-AI/Wan2.2-TI2V-5B-Diffusers
    pipeline: wan_image_to_video
    license: Apache-2.0
    min_vram_gb: 24
    default_height: 704
    default_width: 1280
    default_fps: 24
    default_num_frames: 81
    default_steps: 40
    default_guidance: 5.0

  i2v_a14b:
    model_id: Wan-AI/Wan2.2-I2V-A14B-Diffusers
    pipeline: wan_image_to_video
    license: Apache-2.0
    min_vram_gb: 48
    default_height: 720
    default_width: 1280
    default_fps: 24
    default_num_frames: 81
    default_steps: 40
    default_guidance: 5.0

default_negative_prompt: >-
  色调艳丽，过曝，静态，细节模糊不清，字幕，风格，作品，画作，画面，静止，整体发灰，
  最差质量，低质量，JPEG压缩残留，丑陋的，残缺的，多余的手指，画得不好的手部，
  画得不好的脸部，畸形的，毁容的，形态畸形的肢体，手指融合，静止不动的画面，
  杂乱的背景，三条腿，背景人很多，倒着走
